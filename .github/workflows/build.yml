name: Derle (Android + Windows + Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:            # sprite render bitince yeniden derle
    workflows: ["Sprite render (Blender)", "Harita render (Blender)"]
    types: [completed]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: derle
  cancel-in-progress: false

jobs:
  build:
    # sprite render atlandiysa/basarisizsa tekrar derleme
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve export şablonlarını önbellekten al
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Godot indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Projeyi içe aktar
        run: |
          chmod +x ~/godot/godot
          # varlik hatti: import ayarlari tek yerden (tools/varlik_ayarlari.json)
          python3 tools/varlik/hat.py ayarla
          ~/godot/godot --headless --import || true
          # karakter sprite'lari: platform bicimi (ETC2 telefon / S3TC PC) zstd sikistirilmis .res
          # (APK .ctex'i sikistirmadan saklar; 59 MB -> 13 MB). Paket varsa ayarla export filtrelerini ayirir.
          ~/godot/godot --headless -s res://tools/varlik/sprite_paketle.gd
          python3 tools/varlik/hat.py ayarla
          grep -n "exclude_filter" export_presets.cfg

      - name: Kayıt sistemi testi
        run: |
          # kaydet -> yukle -> ayni durum; bozuk/gelecek/eski surum dosyalari (Tur 4)
          ~/godot/godot --headless -s res://tests/sim_kayit.gd -- --level=res://levels/bolum2.json

      - name: Açı çevirme testi (beklemesiz, PC 4 açı / telefon 3 açı bellekte)
        run: |
          ~/godot/godot --headless -s res://tests/sim_aci.gd -- --level=res://levels/bolum5.json --kip=pc
          ~/godot/godot --headless -s res://tests/sim_aci.gd -- --level=res://levels/bolum5.json --kip=mobil

      - name: Pencere / kapı deliği / takip / yakından fark etme testi (Tur 6)
        run: |
          ~/godot/godot --headless -s res://tests/sim_pencere.gd -- --level=res://levels/bolum1.json
          ~/godot/godot --headless -s res://tests/sim_pencere.gd -- --level=res://levels/bolum6.json
          ~/godot/godot --headless -s res://tests/sim_bolum.gd -- --level=res://levels/bolum7.json

      - name: PC derlemesi (Windows + Linux, en kaliteli sürüm)
        run: |
          mkdir -p build/windows build/linux build/dist
          ~/godot/godot --headless --export-release "Windows" build/windows/Komando.exe
          ~/godot/godot --headless --export-release "Linux" build/linux/Komando.x86_64
          cd build/windows && zip -q -r ../dist/Komando-Windows.zip . && cd ../..
          cd build/linux && chmod +x Komando.x86_64 && zip -q -r ../dist/Komando-Linux.zip . && cd ../..
          ls -la build/dist

      - name: Android ayarları
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android APK derlemesi
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/$f
          done
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$PWD/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          # release sablonu (debug'dan ~8 MB kucuk, daha hizli); ayni anahtarla imzalanir
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$PWD/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          mkdir -p build/android
          ~/godot/godot --headless --export-release "Android" build/android/komando.apk

      - name: Boyut bütçesi (APK / zip / bölüm başına MB)
        run: |
          ls -la build/android build/dist | grep -E "apk|zip" || true
          python3 tools/varlik/hat.py butce --build build --md build/boyut.md
          { echo "Otomatik derleme: ${{ github.sha }}"; echo; cat build/boyut.md; } > build/surum_notu.md

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: komando-apk
          path: build/android/komando.apk

      - name: APK'yı sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Komando - son sürüm
          body_path: build/surum_notu.md
          files: |
            build/android/komando.apk
            build/dist/Komando-Windows.zip
            build/dist/Komando-Linux.zip
          make_latest: true

      - name: Gece sürümü etiketi (Istanbul tarihi)
        run: echo "GECE=gece-$(TZ=Europe/Istanbul date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: O gecenin sürümünü ayrıca sakla (gece-YYYY-AA-GG)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GECE }}
          name: Komando - ${{ env.GECE }}
          body_path: build/surum_notu.md
          files: |
            build/android/komando.apk
            build/dist/Komando-Windows.zip
            build/dist/Komando-Linux.zip
          make_latest: false

