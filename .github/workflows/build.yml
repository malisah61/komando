name: Derle (Web + Android)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:            # sprite render bitince yeniden derle
    workflows: ["Sprite render (Blender)", "Harita render (Blender)"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: derle
  cancel-in-progress: false

jobs:
  build:
    # sprite render atlandiysa/basarisizsa tekrar derleme
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve export şablonlarını önbellekten al
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Godot indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Projeyi içe aktar
        run: |
          chmod +x ~/godot/godot
          ~/godot/godot --headless --import || true

      - name: Web derlemesi
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Web'i GitHub Pages'e yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: "Web yayini ${{ github.sha }}"
        continue-on-error: true

      # Pages kaynagi "GitHub Actions" secildiyse de oyun yayinlansin
      - name: Pages paketi
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
        continue-on-error: true

      - name: PC derlemesi (Windows + Linux)
        continue-on-error: true
        run: |
          mkdir -p build/windows build/linux build/dist
          ~/godot/godot --headless --export-release "Windows" build/windows/Komando.exe
          ~/godot/godot --headless --export-release "Linux" build/linux/Komando.x86_64
          cd build/windows && zip -q -r ../dist/Komando-Windows.zip . && cd ../..
          cd build/linux && chmod +x Komando.x86_64 && zip -q -r ../dist/Komando-Linux.zip . && cd ../..
          ls -la build/dist

      - name: Android ayarları
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android APK derlemesi
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/$f
          done
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$PWD/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build/android
          ~/godot/godot --headless --export-debug "Android" build/android/komando.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: komando-apk
          path: build/android/komando.apk

      - name: APK'yı sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Komando - son sürüm
          body: "Otomatik derleme: ${{ github.sha }}"
          files: |
            build/android/komando.apk
            build/dist/Komando-Windows.zip
            build/dist/Komando-Linux.zip
          make_latest: true

  pages:
    # GitHub Pages kaynagi "GitHub Actions" ise oyunu buradan yayinla (gh-pages dali da guncel kalir)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
