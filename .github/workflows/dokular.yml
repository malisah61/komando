name: Araç - Doku indir (Poly Haven CC0)
on:
  push:
    branches: [main]
    paths: ["tools/dokular.json", "tools/doku_indir.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/doku_indir.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/textures
          git diff --cached --quiet || git commit -m "Dokular indirildi (Poly Haven CC0) [render-yok]"
          git pull --rebase && git push
