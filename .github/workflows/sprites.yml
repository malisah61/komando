name: Sprite render (Blender)

# tools/blender/ altindaki asker modeli/kiyafet/animasyon degisince tum karakterleri
# Quaternius UAL (CC0) hareketleriyle paralel olarak yeniden render eder ve repoya yazar.
# Commit mesajinda [render-yok] varsa calismaz.
on:
  push:
    branches: [main]
    paths: ["tools/blender/asker.py", "tools/blender/asker2.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[render-yok]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        outfit: [komando, alman_er, alman_subay, alman_kis, alman_elit, pilot, direnisci]
    steps:
      - uses: actions/checkout@v4
      - name: Blender önbellek
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3
      - name: Blender indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender && cd ~/blender
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender-4.2.3-linux-x64.tar.xz && rm blender-4.2.3-linux-x64.tar.xz
      - name: Render
        run: |
          # gecici hatalara karsi bir kez daha dene
          ~/blender/blender-4.2.3-linux-x64/blender -b --python tools/blender/asker2.py -- --out out --outfits ${{ matrix.outfit }} \
            || ~/blender/blender-4.2.3-linux-x64/blender -b --python tools/blender/asker2.py -- --out out --outfits ${{ matrix.outfit }}
          ls out/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-${{ matrix.outfit }}
          path: out/

  yaz:
    needs: render
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: indirilen
          pattern: sprite-*
          merge-multiple: true
      - name: Repoya yaz
        run: |
          cp indirilen/* assets/sprites/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites
          git diff --cached --quiet || git commit -m "Sprite'lar yeniden render edildi (UAL) [render-yok]"
          git pull --rebase && git push
